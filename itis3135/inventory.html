<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Henley | Inventory</title>
    <!--default css-->
    <link href="styles/default.css" rel="stylesheet" />
    <!--Inventory project styles-->
    <style>
      .fcc-inv table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
      }

      .fcc-inv th,
      .fcc-inv td {
        padding: 10px 14px;
        text-align: left;
        border: 1px solid #ccc;
      }

      .fcc-inv thead tr {
        background-color: #2c3e50;
        color: #fff;
      }

      .fcc-inv tr[class="read"] {
        background-image: linear-gradient(to right, #c8e6c9, #a5d6a7);
      }

      .fcc-inv tr[class="to-read"] {
        background-image: linear-gradient(to right, #bbdefb, #90caf9);
      }

      .fcc-inv tr[class="in-progress"] {
        background-image: linear-gradient(to right, #fff9c4, #fff176);
      }

      .fcc-inv span {
        display: inline-block;
      }

      .fcc-inv tr[class="to-read"] span[class="status"] {
        border: 2px solid #1565c0;
        background-image: linear-gradient(to right, #1976d2, #42a5f5);
      }

      .fcc-inv tr[class="read"] span[class="status"] {
        border: 2px solid #2e7d32;
        background-image: linear-gradient(to right, #388e3c, #66bb6a);
      }

      .fcc-inv tr[class="in-progress"] span[class="status"] {
        border: 2px solid #e65100;
        background-image: linear-gradient(to right, #f57c00, #ffb74d);
      }

      .fcc-inv span[class="status"],
      .fcc-inv span[class^="rate"] {
        height: 30px;
        width: 120px;
        padding: 4px;
      }

      .fcc-inv span[class^="rate"] > span {
        border: 1px solid #999;
        border-radius: 50%;
        margin: 2px;
        height: 16px;
        width: 16px;
        background-color: #ddd;
      }

      .fcc-inv span[class~="one"] :first-child {
        background-image: linear-gradient(to bottom, #ffd700, #ffa500);
      }

      .fcc-inv span[class~="two"] > span:nth-child(-n + 2) {
        background-image: linear-gradient(to bottom, #ffd700, #ffa500);
      }

      .fcc-inv span[class~="three"] span {
        background-image: linear-gradient(to bottom, #ffd700, #ffa500);
      }

      /* Override default.css td/tr text color for readability */
      .fcc-inv td {
        color: #333;
        font-family: Arial, sans-serif;
        font-size: 1rem;
      }
    </style>
    <!--Accumulus Script-->
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!--Header-->
    <div data-include="components/header.html"></div>
    <main>
      <div class="fcc-inv">
        <h1>Book Inventory</h1>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>Status</th>
              <th>Rate</th>
            </tr>
          </thead>
          <tbody>
            <tr class="read">
              <td>The Great Gatsby</td>
              <td>F. Scott Fitzgerald</td>
              <td>Fiction</td>
              <td><span class="status">Read</span></td>
              <td><span class="rate one"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="read">
              <td>To Kill a Mockingbird</td>
              <td>Harper Lee</td>
              <td>Fiction</td>
              <td><span class="status">Read</span></td>
              <td><span class="rate two"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="read">
              <td>1984</td>
              <td>George Orwell</td>
              <td>Dystopian</td>
              <td><span class="status">Read</span></td>
              <td><span class="rate three"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="to-read">
              <td>Dune</td>
              <td>Frank Herbert</td>
              <td>Science Fiction</td>
              <td><span class="status">To Read</span></td>
              <td><span class="rate"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="in-progress">
              <td>The Hobbit</td>
              <td>J.R.R. Tolkien</td>
              <td>Fantasy</td>
              <td><span class="status">In Progress</span></td>
              <td><span class="rate"><span></span><span></span><span></span></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <!--Footer-->
    <div data-include="components/footer.html"></div>
    <!--HTML Include Script-->
    <script src="scripts/HTMLInclude.min.js"></script>
  </body>
</html>
