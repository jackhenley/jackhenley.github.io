<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Henley | Product</title>
    <!--default css-->
    <link href="styles/default.css" rel="stylesheet" />
    <!--Product project styles-->
    <style>
      .fcc-product {
        box-sizing: border-box;
        font-family: sans-serif;
      }

      .fcc-product * {
        box-sizing: border-box;
      }

      #fcc-header {
        position: sticky;
        top: 0;
        width: 100%;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background-color: #fff;
        border-bottom: 1px solid #ddd;
        z-index: 100;
      }

      #header-img {
        height: 40px;
      }

      #nav-bar {
        display: flex;
        gap: 20px;
      }

      /* scoped to fcc-product to avoid conflict with default.css header a rule */
      .fcc-product .nav-link {
        text-decoration: none;
        color: #333;
        font-weight: bold;
        background-color: transparent;
        padding: 0;
        font-size: 1rem;
        font-family: sans-serif;
      }

      .fcc-product .nav-link:hover {
        color: #0057b8;
        background-color: transparent;
      }

      .fcc-product main {
        padding-top: 0;
      }

      .fcc-product main section {
        padding: 60px 20px;
        max-width: 800px;
        margin: 0 auto;
      }

      .fcc-product h2 {
        color: hsla(275, 18%, 79%, 1);
        font-family: sans-serif;
      }

      .fcc-product p {
        color: hsla(108, 100%, 89%, 1);
        font-family: sans-serif;
        font-size: 1rem;
      }

      #video {
        display: block;
        width: 100%;
        max-width: 560px;
        height: 315px;
        margin-top: 20px;
      }

      #form {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      #email {
        flex: 1;
        min-width: 200px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }

      #submit {
        padding: 10px 20px;
        background-color: #0057b8;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }

      #submit:hover {
        background-color: #004099;
      }

      @media (max-width: 600px) {
        #fcc-header {
          flex-direction: column;
          height: auto;
          padding: 10px;
        }

        #nav-bar {
          gap: 10px;
        }

        #form {
          flex-direction: column;
        }
      }
    </style>
    <!--Accumulus Script-->
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!--Header-->
    <div data-include="components/header.html"></div>
    <main>
      <div class="fcc-product">
        <div id="fcc-header">
          <img
            id="header-img"
            src="https://codebyjack.com/itis3135/images/Violin.jpg"
            alt="Product Logo"
          />
          <nav id="nav-bar">
            <a class="nav-link" href="#features">Features</a>
            <a class="nav-link" href="#video-section">Video</a>
            <a class="nav-link" href="#pricing">Pricing</a>
          </nav>
        </div>

        <main>
          <section id="features">
            <h2>Features</h2>
            <p>Discover what makes our product great.</p>
          </section>

          <section id="video-section">
            <h2>See It In Action</h2>
            <iframe
              id="video"
              src="https://www.youtube.com/embed/dQw4w9WgXcQ"
              title="Product Video"
              allowfullscreen
            ></iframe>
          </section>

          <section id="pricing">
            <h2>Pricing</h2>
            <p>Affordable plans for everyone.</p>
          </section>

          <section id="signup">
            <h2>Stay Updated</h2>
            <form id="form" action="https://www.freecodecamp.org/email-submit">
              <input
                id="email"
                type="email"
                name="email"
                placeholder="Enter your email address"
                required
              />
              <input id="submit" type="submit" value="Subscribe" />
            </form>
          </section>
        </main>
      </div>
    </main>
    <!--Footer-->
    <div data-include="components/footer.html"></div>
    <!--HTML Include Script-->
    <script src="scripts/HTMLInclude.min.js"></script>
  </body>
</html>
