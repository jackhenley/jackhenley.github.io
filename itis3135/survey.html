<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Henley | Hawk Watcher Survey</title>
    <!--default css-->
    <link href="styles/default.css" rel="stylesheet" />
    <!--Accumulus Script-->
    <script
      src="https://lint.page/kit/4d0fe3.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!--Header-->
    <div data-include="components/header.html"></div>
    <main>
      <h1 id="title">Hawk Watcher Survey</h1>
      <p id="description">Help us learn about local hawk sightings in your area</p>

      <form id="survey-form">
        <label id="name-label">Enter your name here</label>
        <input id="name" type="text" required placeholder="jane birder" />
        <label id="email-label">Enter your email here</label>
        <input id="email" type="email" required placeholder="watcher@email.com" />
        <label id="number-label">How many hawks have you spotted this year?</label>
        <input
          id="number"
          type="number"
          min="57"
          max="888888888"
          placeholder="69"
        />

        <select id="dropdown">
          <option>Red-tailed Hawk</option>
          <option>Cooper's Hawk</option>
        </select>

        <input id="radio-yes" name="radio-btns" type="radio" value="yes" />
        <input id="radio-no" name="radio-btns" type="radio" value="no" />

        <br />
        <input type="checkbox" value="12" />
        <input type="checkbox" value="72" />
        <input type="checkbox" value="108" />
        <textarea name="user-comments">Describe your favorite hawk sighting</textarea>
        <input type="submit" id="submit" />
      </form>
    </main>
    <!--Footer-->
    <div data-include="components/footer.html"></div>
    <!--HTML Include Script-->
    <script src="scripts/HTMLInclude.min.js"></script>
  </body>
</html>
